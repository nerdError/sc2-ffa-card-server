<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SC2 FFA Card Server by nerdError</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 24px;
        background: #111;
        color: #eee;
      }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p  { color: #888; margin: 0 0 24px; }
      .card {
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 12px;
        padding: 16px 20px;
        margin-bottom: 16px;
      }
      .card h2 { margin: 0 0 12px; font-size: 15px; color: #aaa; font-weight: 500; }
      .addr {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      code {
        background: #000;
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 14px;
        color: #6ee7b7;
      }
      a.btn {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 6px;
        background: #2a2a2a;
        color: #eee;
        text-decoration: none;
        font-size: 14px;
        border: 1px solid #444;
      }
      a.btn:hover { background: #333; }
      #error { color: #f87171; }
    </style>
  </head>
  <body>
    <h1>SC2 FFA Card Server by nerdError</h1>
    <p>Откройте viewer на ПК, а controller — на телефоне, в одной сети.</p>

    <div class="card">
      <h2>Локально (на этом ПК)</h2>
      <div class="addr">
        <code id="local-viewer">/viewer.html</code>
        <a class="btn" id="local-viewer-link" href="/viewer.html" target="_blank">открыть</a>
      </div>
      <div class="addr">
        <code id="local-controller">/controller.html</code>
        <a class="btn" id="local-controller-link" href="/controller.html" target="_blank">открыть</a>
      </div>
    </div>

    <div class="card">
      <h2>С телефона (та же Wi-Fi/Ethernet сеть)</h2>
      <div id="network-list">Загрузка…</div>
    </div>

    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
