<!doctype html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viewer</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }

        #stage {
            width: 100vw;
            height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        #pic {
            max-width: 95vw;
            max-height: 95vh;
            display: block;
            opacity: 0;
            pointer-events: none;
            will-change: transform, opacity;
            background: transparent;
            /* никаких transition, никаких from-* классов — анимируем через JS */
        }
    </style>
</head>

<body>
    <div id="stage"><img id="pic" alt="" /></div>
    <script type="module" src="/src/viewer.ts"></script>
</body>

</html>
